name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'
      - name: Compile Compact contract
        run: |
          npm run compile
          git diff --exit-code -- managed
      - name: Verify source and protocol behavior
        run: npm run check
      - name: Build deployable web artifact
        run: npm run build
      - name: Verify deployment contract
        run: npm run verify:web
      - name: Audit production dependencies
        run: npm run audit

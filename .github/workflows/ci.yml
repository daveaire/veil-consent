name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'
      - name: Compile Compact contract
        run: |
          npm run compile
          git diff --exit-code -- managed
      - name: Verify source and protocol behavior
        run: npm run check
      - name: Build deployable web artifact
        run: npm run build
      - name: Build network-backed pilot artifact
        run: npm run build:live
      - name: Validate and build live deployment containers
        run: |
          mkdir -p infrastructure/secrets infrastructure/state
          cp infrastructure/.env.production.example infrastructure/.env.production
          printf '%s\n' 'ci-only-postgres-password' > infrastructure/secrets/postgres_password
          docker compose -f infrastructure/compose.yaml config --quiet
          docker build -f Dockerfile.live -t veil-consent-live:${{ github.sha }} .
      - name: Verify deployment contract
        run: npm run verify:web
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify browser journeys, accessibility, and visual baselines
        run: npm run test:browser
      - name: Enforce performance and quality budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - name: Audit production dependencies
        run: npm run audit
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
